on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          load: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/craftdock:latest
            ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ github.ref_name }}

      - name: Pull Docker image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/craftdock:latest || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ github.ref_name }} || true

      - name: Verify Docker images exist
        run: docker images | grep ${{ secrets.DOCKER_USERNAME }}/craftdock || echo "Image not found!"

      - name: Save Docker image
        run: |
          docker save ${{ secrets.DOCKER_USERNAME }}/craftdock:latest -o craftdock-latest.tar
          docker save ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ github.ref_name }} -o craftdock-${{ github.ref_name }}.tar

      - name: Generate Changelog
        uses: release-changelog-builder/action@v1
        with:
          owner: "${{ github.repository_owner }}"
          repo: "${{ github.repository }}"
          fromTag: "${{ github.event.inputs.previous_tag || 'v0.0.0' }}"
          toTag: "${{ github.ref_name }}"
          outputFile: "release_notes.md"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            craftdock-latest.tar
            craftdock-${{ github.ref_name }}.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}