name: Docker Build and Publish

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercased owner
        id: owner
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1)
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=$OWNER_LOWER" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          load: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/craftdock:latest
            ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.owner_lower }}/craftdock:latest
            ghcr.io/${{ steps.owner.outputs.owner_lower }}/craftdock:${{ github.ref_name }}

      - name: Pull Docker image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/craftdock:latest || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ github.ref_name }} || true

      - name: Verify Docker images exist
        run: docker images | grep ${{ secrets.DOCKER_USERNAME }}/craftdock || echo "Image not found!"

      - name: Save Docker image
        run: |
          docker save ${{ secrets.DOCKER_USERNAME }}/craftdock:latest -o craftdock-latest.tar
          docker save ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ github.ref_name }} -o craftdock-${{ github.ref_name }}.tar

      - name: Make GHCR package public
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          API_ORG="https://api.github.com/orgs/${OWNER}/packages/container/${PKG}/visibility"
          API_USER="https://api.github.com/user/packages/container/${PKG}/visibility"
          echo "Package: $PKG, Owner: $OWNER"
          for API in "$API_ORG" "$API_USER"; do
            echo "Trying $API"
            HTTP=$(curl -s -o /tmp/resp -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d '{"visibility":"public"}' \
              "$API" || true)
            echo "HTTP $HTTP"
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
              echo "Success setting visibility via $API"
              cat /tmp/resp || true
              exit 0
            fi
            echo "Response:"; cat /tmp/resp || true
          done
          echo "Failed to set package visibility with GITHUB_TOKEN. If this step fails, add a PAT with 'packages:write' in a secret (e.g. GPR_PAT) and use it in a fallback step."
          exit 0

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, setting to initial commit"
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Previous tag: $PREV_TAG"
          echo "prev_tag=$PREV_TAG" >> $GITHUB_ENV

      - name: Generate Changelog
        id: changelog
        uses: janheinrichmerker/action-github-changelog-generator@v2.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prev_tag: ${{ steps.prev_tag.outputs.prev_tag }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: |
            craftdock-latest.tar
            craftdock-${{ github.ref_name }}.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}