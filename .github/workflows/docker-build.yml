on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract tag name
        id: extract_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/craftdock:latest
            ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ env.TAG_NAME }}

      - name: Verify Docker image existence
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/craftdock:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ env.TAG_NAME }}

      - name: Save Docker image
        run: |
          docker save ${{ secrets.DOCKER_USERNAME }}/craftdock:latest -o craftdock-latest.tar
          docker save ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ env.TAG_NAME }} -o craftdock-${{ env.TAG_NAME }}.tar
      
      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p' || echo "")
          echo "Previous tag: $PREV_TAG"
          echo "prev_tag=$PREV_TAG" >> $GITHUB_ENV

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG="${{ env.prev_tag }}"
          echo "## What's Changed" > release_notes.md

          # Hitta merge commits och extrahera PR-nummer
          if [ -n "$PREV_TAG" ]; then
            git log $PREV_TAG..HEAD --merges --pretty=format:"%s by @%an" | grep -oE "#[0-9]+" | while read pr; do
              echo "- PR $pr by @$(git log --merges --grep="$pr" --pretty=format:'%an' -1) in https://github.com/${{ github.repository }}/pull/${pr#\#}"
            done >> release_notes.md
          else
            git log --merges --pretty=format:"%s by @%an" | grep -oE "#[0-9]+" | while read pr; do
              echo "- PR $pr by @$(git log --merges --grep="$pr" --pretty=format:'%an' -1) in https://github.com/${{ github.repository }}/pull/${pr#\#}"
            done >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}" >> release_notes.md

          cat release_notes.md
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat release_notes.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload latest image asset to Github
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./craftdock-latest.tar
          asset_name: craftdock-latest.tar
          asset_content_type: application/x-tar

      - name: Upload versioned image asset to Github
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./craftdock-${{ env.TAG_NAME }}.tar
          asset_name: craftdock-${{ env.TAG_NAME }}.tar
          asset_content_type: application/x-tar