on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          load: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/craftdock:latest
            ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ github.ref_name }}

      - name: Pull Docker image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/craftdock:latest || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ github.ref_name }} || true

      - name: Verify Docker images exist
        run: docker images | grep ${{ secrets.DOCKER_USERNAME }}/craftdock || echo "Image not found!"

      - name: Save Docker image
        run: |
          docker save ${{ secrets.DOCKER_USERNAME }}/craftdock:latest -o craftdock-latest.tar
          docker save ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ github.ref_name }} -o craftdock-${{ github.ref_name }}.tar
      
      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, setting to initial commit"
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Previous tag: $PREV_TAG"
          echo "prev_tag=$PREV_TAG" >> $GITHUB_ENV

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG="${{ env.prev_tag }}"
          echo "## What's Changed" > release_notes.md

          if [ -n "$PREV_TAG" ]; then
            git log --merges --pretty=format:"%H" $PREV_TAG..HEAD | while read commit_hash; do
              PR=$(git log -1 --pretty=format:"%s %b" $commit_hash | grep -oE "#[0-9]+" | head -n 1)
              TITLE=$(git log -1 --pretty=format:"%s" $commit_hash)
              AUTHOR=$(git log -1 --pretty=format:"%an" $commit_hash)

              if [ -n "$PR" ]; then
                echo "- **$TITLE** (#${PR#\#}) by @$AUTHOR in https://github.com/${{ github.repository }}/pull/${PR#\#}" >> release_notes.md
              fi
            done
          fi

          echo "" >> release_notes.md
          echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}" >> release_notes.md

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            craftdock-latest.tar
            craftdock-${{ github.ref_name }}.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}