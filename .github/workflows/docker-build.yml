on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          load: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/craftdock:latest
            ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ github.ref_name }}

      - name: Pull Docker image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/craftdock:latest || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ github.ref_name }} || true

      - name: Save Docker image
        run: |
          docker save ${{ secrets.DOCKER_USERNAME }}/craftdock:latest -o craftdock-latest.tar
          docker save ${{ secrets.DOCKER_USERNAME }}/craftdock:${{ github.ref_name }} -o craftdock-${{ github.ref_name }}.tar
      
      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | sed -n '2p' || echo "")
          echo "Previous tag: $PREV_TAG"
          echo "prev_tag=$PREV_TAG" >> $GITHUB_ENV

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG="${{ env.prev_tag }}"
          echo "## What's Changed" > release_notes.md

          if [ -n "$PREV_TAG" ]; then
            git log --merges --pretty=format:"%b" $PREV_TAG..HEAD | grep -oE "#[0-9]+" | sort -u | while read pr; do
              echo "- PR $pr by @$(git log --merges --grep="$pr" --pretty=format:'%an' -1) in https://github.com/${{ github.repository }}/pull/${pr#\#}"
            done >> release_notes.md
          else
            git log --merges --pretty=format:"%b" | grep -oE "#[0-9]+" | sort -u | while read pr; do
              echo "- PR $pr by @$(git log --merges --grep="$pr" --pretty=format:'%an' -1) in https://github.com/${{ github.repository }}/pull/${pr#\#}"
            done >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}" >> release_notes.md

          cat release_notes.md
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat release_notes.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
          files: |
            craftdock-latest.tar
            craftdock-${{ github.ref_name }}.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}